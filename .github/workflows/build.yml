name: Build and Release

# Manual only: run from the Actions tab (or `gh workflow run build.yml -f tag=v1.0.0`).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            gradle assembleRelease --stacktrace
            cp app/build/outputs/apk/release/app-release.apk "GroupMe-$TAG.apk"
          else
            echo "::warning::No KEYSTORE_BASE64 secret found; building the debug-signed APK instead."
            gradle assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "GroupMe-$TAG.apk"
          fi

      - name: Create GitHub release
        run: |
          args=()
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" "GroupMe-$TAG.apk" \
            --title "$TAG" \
            --generate-notes \
            --target "$GITHUB_SHA" \
            "${args[@]}"
